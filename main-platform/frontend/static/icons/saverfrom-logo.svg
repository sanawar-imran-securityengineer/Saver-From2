<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9933;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Sleek outer cloud/ring shape -->
  <path d="M 25 50 A 20 20 0 0 1 65 40 A 25 25 0 0 1 75 75 L 25 75 A 25 25 0 0 1 25 25" fill="none" stroke="url(#secondaryGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  
  <!-- Dynamic Down Arrow -->
  <path d="M 50 20 L 50 65 M 30 45 L 50 65 L 70 45" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
